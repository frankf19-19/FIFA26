name: euro-calib
on:
  schedule:
    - cron: "40 9 * * *"        # 每日 UTC 09:40 = 台灣 17:40
  workflow_dispatch:            # 也可手動觸發(手動 = 全量重跑,不接續當天進度)
permissions:
  contents: write
concurrency:
  group: euro-calib
  cancel-in-progress: false
jobs:
  calib:
    runs-on: ubuntu-latest
    env:
      CALIB_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/calib-euro.js
      - name: commit calib.json
        run: |
          git config user.name  "calib-bot"
          git config user.email "bot@users.noreply.github.com"
          git add calib.json matches.json
          git diff --cached --quiet || git commit -m "daily euro calibration"
          # 執行期間若 repo 有新 commit,先同步再推(衝突時保留本次校準結果)
          git pull --rebase origin main || { git rebase --abort || true; git pull --no-rebase -X ours origin main; }
          git push

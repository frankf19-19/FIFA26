name: auto-tune
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: euro-calib
  cancel-in-progress: false
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/autotune.py
      - name: commit tune.json
        run: |
          git config user.name  "tune-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tune.json
          git diff --cached --quiet || git commit -m "auto-tune $(date -u +%F)"
          git pull --rebase origin main || { git rebase --abort || true; git pull --no-rebase -X ours origin main; }
          git push

    if(predOut===realOut) parts.push(`模型賽前看好${pkz}(${Math.max(p.H,p.D,p.A).toFixed(0)}%),方向命中`);
    else parts.push(`模型賽前看好${pkz}(${Math.max(p.H,p.D,p.A).toFixed(0)}%),此役未能命中`);
    // 數據佐證(有才寫)
    const pos=statPairs.find(s=>s.key==="possessionPct"), sot=statPairs.find(s=>s.key==="shotsOnTarget");
    if(pos) parts.push(`控球 ${pos.h}% 對 ${pos.a}%`);
    if(sot) parts.push(`射正 ${sot.h} 比 ${sot.a}`);
    if(goals.length) parts.push(`共 ${goals.length} 粒進球`);
  }else if(g.state==="in"){
    parts.push(`比賽進行中${g.detail?`(${g.detail})`:""},目前 ${hz} ${g.hs??0} - ${g.as??0} ${az}`);
    parts.push(`賽前模型看好${p.pick==="和局"?"和局":(p.pick===g.hn?hz:az)}(主勝 ${p.H}%、和 ${p.D}%、客勝 ${p.A}%)`);
  }else{
    parts.push(`${hz}主場迎戰${az}`);
    const fh=formSeq(g.hn), fa=formSeq(g.an);
    if(fh||fa) parts.push(`近況 ${hz} ${fh||"—"} vs ${az} ${fa||"—"}(新→舊)`);
    parts.push(`模型預測:主勝 ${p.H}%、和 ${p.D}%、客勝 ${p.A}%,看好${p.pick==="和局"?"和局":(p.pick===g.hn?hz:az)},預期比分 ${p.si}-${p.sj}`);
    parts.push(`信心 ${p.conf}`);
  }
  return parts.join(",")+"。(解說由模型與 ESPN 數據自動生成)";
}
/* 射門視覺:透視半場 + 金色軌跡(Apple Sports 風)。無真實座標時為示意圖並誠實標示 */
function shotSVG(e){
  const hash=[...String(e.a||"x")].reduce((a,ch)=>a+ch.charCodeAt(0),0);
  let px,py,real=false;
  if(e.c&&e.c.x>=0&&e.c.x<=100&&e.c.y>=0&&e.c.y<=100){ px=e.c.x/100; py=Math.min(.72,Math.max(.08,e.c.y/100*.6+.08)); real=true; }
  else { px=.32+(hash%6)*.072; py=.16+(hash%4)*.075; }
  const W=y=>64+36*y, LX=y=>18-18*y;                    // 透視:深度 y∈[0,1] 對應寬度/左緣
  const P=(fx,fy)=>[LX(fy)+W(fy)*fx, 10+85*fy];         // 場上座標 → SVG
  const [sx,sy]=P(px,py);
  const tx=.22+((hash>>3)%5)*.14;                       // 進球落點(門內左/中/右)
  const gx=38+24*tx, gy=6.2;
  const box=(fx0,fy0,fx1,fy1)=>{const[a,b]=P(fx0,fy0),[c,d]=P(fx1,fy0),[e2,f]=P(fx1,fy1),[g2,i]=P(fx0,fy1);
    return `${a},${b} ${c},${d} ${e2},${f} ${g2},${i}`;};
  return `<svg viewBox="0 0 100 100" class="shotmap" aria-label="射門位置圖">
    <polygon points="${box(0,0,1,1)}" fill="none" stroke="var(--line)" stroke-width=".7"/>
    <polygon points="${box(.18,0,.82,.34)}" fill="none" stroke="var(--line)" stroke-width=".6"/>
    <polygon points="${box(.34,0,.66,.13)}" fill="none" stroke="var(--line)" stroke-width=".6"/>
    <path d="M ${P(.40,.34)[0]} ${P(.40,.34)[1]} Q ${P(.5,.45)[0]} ${P(.5,.45)[1]} ${P(.60,.34)[0]} ${P(.60,.34)[1]}" fill="none" stroke="var(--line)" stroke-width=".6"/>
    <rect x="36" y="0" width="28" height="8.5" fill="none" stroke="var(--chalk)" stroke-width="1.1"/>
    <ellipse cx="${gx}" cy="${gy}" rx="3.1" ry="1.5" fill="none" stroke="var(--hit)" stroke-width="1"/>
    <polygon points="${gx-1.9},${gy} ${gx+1.9},${gy} ${sx},${sy}" fill="var(--gold)" opacity=".85"/>
    <circle cx="${sx}" cy="${sy+2.2}" r="1.7" fill="none" stroke="var(--chalk)" stroke-width=".9"/>
    <circle cx="${sx}" cy="${sy-3.4}" r="1.6" fill="var(--chalk)"/>
    <path d="M ${sx} ${sy-1.8} L ${sx} ${sy+.6} M ${sx} ${sy-.9} L ${sx-2} ${sy+.4} M ${sx} ${sy-.9} L ${sx+1.8} ${sy-2.2}" stroke="var(--chalk)" stroke-width=".9" fill="none"/>
    <text x="50" y="98.5" text-anchor="middle" font-size="3.4" fill="var(--muted)" font-family="var(--mono)">${real?"位置依 ESPN 座標":"示意圖(ESPN 未提供實際射門座標)"}</text>
  </svg>`;
}

    const hSh=gv(hst,"totalShots"), hSot=gv(hst,"shotsOnTarget"), aSh=gv(ast,"totalShots"), aSot=gv(ast,"shotsOnTarget");
    if(hSh!=null&&aSh!=null) statPairs.push({key:"totalShots",label:"射門(射正)",h:`${hSh}${hSot!=null?` (${hSot})`:""}`,a:`${aSh}${aSot!=null?` (${aSot})`:""}`});
    Object.keys(GSTAT_ZH).forEach(k=>{
      const hv=gv(hst,k), av=gv(ast,k);
      if(hv!=null&&av!=null) statPairs.push({key:k,label:GSTAT_ZH[k],h:hv,a:av});
    });
    // 陣型(有就顯示)
    try{
      const fOf=r=>r.formation||((r.team||{}).formation)||null;

      const aR=(sum.rosters||[]).find(r=>norm((r.team||{}).displayName||"")===norm(g.an));
      if(hR&&aR&&fOf(hR)&&fOf(aR)) statPairs.unshift({key:"formation",label:"陣型",h:fOf(hR),a:fOf(aR),noBar:true});
    }catch(e){}
  }catch(e){}
  // --- 先發陣容 ---
  let lineups="";
  try{
    const cols=(sum.rosters||[]).map(r=>{
      const tName=(r.team&&r.team.displayName)||"";
      const starters=(r.roster||[]).filter(x=>x.starter).map(x=>{
        const a=x.athlete||{}; const nm=a.displayName||"";
        const injured=INJ_BY_PLAYER[norm(nm)]?` <span style="color:var(--miss)">🚑</span>`:"";
        return `<div class="pl lu-p" style="cursor:pointer" data-pid="${a.id||""}" data-pname="${nm.replace(/"/g,"&quot;")}" data-ppos="${(x.position&&x.position.abbreviation)||""}" data-pnum="${x.jersey||""}" data-pteam="${tName.replace(/"/g,"&quot;")}"><b>${x.jersey||""}</b>${nm}${injured} <span style="color:var(--muted);font-size:11px">${(x.position&&x.position.abbreviation)||""}</span></div>`;
      }).join("");
      const haLbl = norm(tName)===norm(g.hn)?"主場先發":norm(tName)===norm(g.an)?"客場先發":"先發";
      return starters?`<div class="lineup-col"><div class="t" style="cursor:pointer" data-team="${tName.replace(/"/g,"&quot;")}">${zhName(tName)} ${haLbl} ›</div>${starters}</div>`:"";
    }).filter(Boolean);
    if(cols.length) lineups=`<div class="pos-group">先發陣容</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">${cols.join("")}</div>`;
  }catch(e){}
  // --- 組頁 ---
  const venueLine = g.venue?`<div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin:-6px 0 12px">📍 ${esc(g.venue)} · ${zhName(g.hn)} 主場</div>`:`<div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin:-6px 0 12px">${zhName(g.hn)} 主場 · ${zhName(g.an)} 作客</div>`;
  let narrative=gameNarrative(g,goals,statPairs);
  const rv0=makeReview(g);
  if(rv0) narrative+=` 檢討:${rv0.text}`;
  let html=venueLine+`<div class="why" style="border-top:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:13px 15px;margin-bottom:14px"><span class="k">解說</span>${narrative}</div>
  <div id="h2hBox"></div>`;
  if(!g.completed&&g.state!=="in"){
    html+=probBar(p)+`<div class="predline" style="margin-bottom:14px"><span class="k">預測</span>看好 <span class="pick">${zhName(p.pick)}</span> · 比分 <b><span class="ha hm">主</span> ${p.si} - ${p.sj} <span class="ha aw">客</span></b> · 信心 ${p.conf}</div>
      <div class="why"><span class="k">理由</span>${reasonText(g.hn,g.an,p)}</div>`;
  }
  if(evs.length){
    const icon=k=>k==="goal"?"⚽":k==="red"?"🟥":k==="card"?"🟨":"⇄";
    const cell=e=>`<div class="ce-nm">${e.a}${e.kind==="sub"?` <span class="ce-in">▸入</span>`:""}</div>${e.b?`<div class="ce-sub">${e.kind==="sub"?`${e.b} <span class="ce-out">◂出</span>`:e.b}</div>`:""}`;
    let rows="",htShown=false;
    evs.forEach(e=>{
      const secondHalf = e.half!=null ? e.half>=2 : e.mv>=46;
      if(!htShown&&secondHalf){ rows+=`<div class="ct-row"><div></div><div class="ct-ht">中場休息</div><div></div></div>`; htShown=true; }
      const isGoal=e.kind==="goal";
      rows+=`<div class="ct-row ${isGoal?"ct-goal":""}">
        <div class="ct-l">${e.side==="h"?cell(e):""}${e.side==="h"&&isGoal?`<div class="ce-sc">${zhName(g.hn)} ${e.sc}</div>`:""}</div>
        <div class="ct-c"><span class="ct-ico ${e.kind}">${icon(e.kind)}</span><span class="ct-min">${e.min}</span></div>
        <div class="ct-r">${e.side==="a"?cell(e):""}${e.side==="a"&&isGoal?`<div class="ce-sc">${e.sc} ${zhName(g.an)}</div>`:""}</div>
        ${isGoal?`<div class="ct-goalview"><div class="gv-head">⚽ ${e.min} ${e.a}${e.b?` · ${e.b}`:""}</div>${shotSVG(e)}</div>`:""}
      </div>`;
    });
    let evNote="";
    try{
      const gH=evs.filter(e=>e.kind==="goal"&&e.side==="h").length, gA=evs.filter(e=>e.kind==="goal"&&e.side==="a").length;
      if(g.hs!=null&&g.as!=null&&(gH!==g.hs||gA!==g.as))
        evNote=`<div style="font-family:var(--mono);font-size:11.5px;color:var(--draw);margin:2px 0 10px">⚠ 事件流(${gH}-${gA})與比分(${g.hs}-${g.as})不一致 — ESPN 事件資料延遲或缺漏,稍後點「更新」重試</div>`;
    }catch(e){}
    html+=`<div class="pos-group">比賽事件 <span style="font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted);text-transform:none">(點進球看射門圖)</span></div>`+evNote+`<div class="ct-head"><span class="ha hm">主</span> ${hz}<span style="flex:1"></span>${az} <span class="ha aw">客</span></div>
      <div class="ctl">${rows}</div>`;
  }
  if(statPairs.length){
    html+=`<div class="pos-group">數據對比</div><div style="border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px">
      <div class="cmp-row" style="margin-bottom:12px"><div class="v h" style="color:var(--chalk);cursor:pointer" data-team="${g.hn.replace(/"/g,"&quot;")}">${g.hlogo?`<img src="${g.hlogo}" style="width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px" onerror="this.style.display='none'">`:""}<span class="ha hm">主</span> ${hz} ›</div><div class="l">vs</div><div class="v" style="color:var(--chalk);cursor:pointer" data-team="${g.an.replace(/"/g,"&quot;")}">${az} <span class="ha aw">客</span> ${g.alogo?`<img src="${g.alogo}" style="width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-left:6px" onerror="this.style.display='none'">`:""} ›</div></div>`+
      statPairs.map(s=>{
        if(s.noBar) return `<div class="cmp-row"><div class="v h">${s.h}</div><div class="l">${s.label}</div><div class="v">${s.a}</div></div>`;
        const hn=parseFloat(s.h)||0, an=parseFloat(s.a)||0, tot=(hn+an)||1;
        return `<div class="cmp-row"><div class="v h">${s.h}<div class="cmp-bar" style="direction:rtl"><div style="width:${hn/tot*100}%"></div></div></div>
          <div class="l">${s.label}</div>
          <div class="v">${s.a}<div class="cmp-bar"><div style="width:${an/tot*100}%;background:var(--awy)"></div></div></div></div>`;
      }).join("")+`</div>`;
  }
  html+=lineups;
  try{
    const gi=sum.gameInfo||{};
    const rows=[];
    const vn=(gi.venue&&(gi.venue.fullName||gi.venue.displayName))||g.venue;
    if(vn) rows.push(["球場",vn]);
    const city=gi.venue&&gi.venue.address&&(gi.venue.address.city||gi.venue.address.summary);
    if(city) rows.push(["城市",city]);
    if(gi.attendance) rows.push(["觀眾",Number(gi.attendance).toLocaleString()]);
    (gi.officials||[]).forEach(o=>{
      const pos=((o.position&&(o.position.displayName||o.position.name))||"").toLowerCase();
      const nm=o.fullName||o.displayName; if(!nm) return;
      if(pos.includes("video")||pos==="var") rows.push(["VAR",nm]);
      else if(pos.includes("referee")&&!pos.includes("assistant")) rows.push(["主審",nm]);
    });
    if(rows.length){
      html+=`<div class="pos-group">比賽資訊</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px">`+
        rows.map(([l,v])=>`<div style="background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px 15px">
          <div style="font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase">${l}</div>
          <div style="font-size:14px;margin-top:3px">${esc(v)}</div></div>`).join("")+`</div>`;
    }
  }catch(e){}
  if(!goals.length&&!statPairs.length&&!lineups){
    html+=`<div class="empty">${g.completed?"ESPN 未提供此場的詳細數據。":"尚未開賽——開賽後這裡會顯示進球事件、數據對比與先發陣容。"}</div>`;
  }
  box.innerHTML=html;
  // 點進球 → 展開/收合射門圖
  box.querySelectorAll(".ct-row.ct-goal").forEach(el=>el.onclick=()=>{
    const v=el.querySelector(".ct-goalview"); if(!v) return;
    const open=v.classList.toggle("open");
    box.querySelectorAll(".ct-goalview.open").forEach(x=>{ if(x!==v) x.classList.remove("open"); });
  });
  // 點球隊名 → 球隊頁
  box.querySelectorAll("[data-team]").forEach(el=>el.onclick=()=>showTeam(el.dataset.team));
  // 點先發球員 → 球員詳細頁(索引找得到用完整資料,找不到用當場資料)
  box.querySelectorAll(".lu-p").forEach(el=>el.onclick=()=>{
    const {pid,pname,ppos,pnum,pteam}=el.dataset;
    let p=PLAYER_INDEX.find(x=>String(x.id)===String(pid)) || PLAYER_INDEX.find(x=>norm(x.name)===norm(pname));
    if(!p) p={id:pid,name:pname,pos:ppos,num:pnum,teamName:pteam,headshot:espnHeadshot(pid),age:"",nat:"",league:g.league||curLeague};
    showPlayer(p);
  });
}

/* ================= 載入 ================= */
let LOADING=false, PENDING=false;
async function load(){
  if(LOADING){ PENDING=true; return; }   // 忙碌中收到請求 → 排隊,結束後補跑一次
  LOADING=true;
  const btn=document.getElementById("loadBtn"), st=document.getElementById("status");
  btn.classList.add("spin"); btn.disabled=true; st.className="status"; st.textContent="載入中…";
  hideTeam();
  const dateStr=ymd(curDate);
  document.getElementById("upd").textContent=isoDate(curDate)+" "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  try{
    // ESPN 以美國/UTC 日期分組;抓「前一天+當天」範圍再依台灣當日過濾,確保台灣時間正確
    const d0=new Date(curDate); d0.setDate(d0.getDate()-1);
    // 先抓積分榜:攻防形狀與戰績橫幅都靠它(失敗不影響賽事)
    try{ const sd0=await jget(espnStand(curLeague)); renderStandings(sd0); }catch(e){}
    loadStandFor(curLeague).catch(()=>{});
    const data=await jget(espnScore(curLeague, ymd(d0)+"-"+dateStr), true);
    const all=parseEvents(data);
    const games=all.filter(g=>g.localIso===isoDate(curDate));
    await gradeFinished(all.filter(g=>g.completed));   // 兩天內所有完賽都納入學習(含場面數據)
    if(AUDITED && TODAY_ISO!==isoDate(curDate)) checkTodayGames(isoDate(curDate));
    computeTuning();                              // 依累積賽果更新近況/和局/主場調參
    renderScorecard();
    renderInsights();
    try{ await loadNews(); }catch(e){}
    // 切聯盟後當日無賽事 → 自動跳到最近有比賽的日期(先找未來 21 天,再找過去 7 天)
    if(!games.length && window.__autoJump){
      window.__autoJump=false;
      try{
        const t0=new Date(curDate);
        let target=null;
        // 往未來找:3 段各 7 天,找到就停(分段避免長區間查詢失敗)
        for(let seg=0; seg<3 && !target; seg++){
          const a=new Date(t0); a.setDate(a.getDate()+seg*7);
          const b=new Date(t0); b.setDate(b.getDate()+(seg+1)*7);
          try{
            const sb=await jget(espnScore(curLeague, ymd(a)+"-"+ymd(b)), true);
            const evs=parseEvents(sb).filter(g=>g.localIso>=isoDate(t0));
            if(evs.length) target=evs.map(g=>g.localIso).sort()[0];
          }catch(e){}
        }
        if(!target){   // 未來 21 天都沒有 → 往回找最近踢過的一天
          const back=new Date(t0); back.setDate(back.getDate()-7);
          try{
            const sb=await jget(espnScore(curLeague, ymd(back)+"-"+ymd(t0)), true);
            const evs=parseEvents(sb);
            if(evs.length) target=evs.map(g=>g.localIso).sort().slice(-1)[0];
          }catch(e){}
        }
        if(target && target!==isoDate(curDate)){
          curDate=new Date(target+"T12:00:00");
          const dp=document.getElementById("datePick"); if(dp) dp.value=target;
          st.textContent=`該日無賽事,已跳至最近比賽日 ${target}`;
          LOADING=false; btn.classList.remove("spin"); btn.disabled=false;
          load();
          return;
        }
      }catch(e){}
    }
    window.__autoJump=false;
    renderGames(games);
    renderHeadlines(games);
    st.textContent=`已更新 · ${games.length} 場`;
    window.__lastGames=games;
    loadSchedules(games).then(chg=>{ if(chg&&window.__lastGames===games){ renderGames(games); renderTodaySection&&renderTodaySection(); } });
  }catch(e){
    document.getElementById("games").innerHTML=`<div class="empty">無法載入賽事資料。<br>可能是網路、跨域限制或該聯賽代碼異常。稍後再試或切換聯賽。<br><span style="color:var(--miss)">${e.message}</span></div>`;
    st.className="status err"; st.textContent="載入失敗";
  }
  // standings(獨立,失敗不影響賽事)
  try{
    /* 積分榜已於賽事前載入(供攻防模型使用),此處不重複抓取 */
  }catch(e){
    document.getElementById("standings").innerHTML=`<div class="empty">積分榜暫時無法載入(休賽期或來源限制)。</div>`;
  }
  btn.classList.remove("spin"); btn.disabled=false;
  LOADING=false;
  if(PENDING){ PENDING=false; setTimeout(load,60); }
}

function buildLeagueTabs(){
  const box=document.getElementById("leagueTabs");
  box.innerHTML=`<button class="lg on" id="todayTab">📅 今日比賽</button>`
    +LEAGUES.filter(l=>!l.more&&lgVisible(l)).map(l=>`<button class="lg" data-lg="${l.id}">${l.zh}</button>`).join("")
    +`<select id="moreLg" class="lg" style="cursor:pointer"><option value="">更多聯賽 ▾</option>`
    +LEAGUES.filter(l=>l.more&&lgVisible(l)).map(l=>`<option value="${l.id}">${l.zh} ${l.full}</option>`).join("")+`</select>`;
  function switchLeague(id,fromPop){
    VIEW="league";
    if(!fromPop){ try{
      const s=history.state;
      if(!(s&&s.v==="league"&&s.lg===id)) history.pushState({v:"league",lg:id},"");
    }catch(e){} }
    curLeague=id;
    document.querySelectorAll(".lg").forEach(x=>x.classList.toggle("on",x.dataset.lg===curLeague));
    const lg=LEAGUES.find(l=>l.id===curLeague);
    document.getElementById("lgName").textContent=lg.full;
    window.__autoJump=true;                           // 本次切換若當日無賽事 → 自動跳到最近比賽日
    { const tod=new Date();                           // 每個聯盟都從「今天」出發找最近比賽日
      if(isoDate(curDate)!==isoDate(tod)){ curDate=tod;
        const dp0=document.getElementById("datePick"); if(dp0) dp0.value=isoDate(tod); } }
    STAND_CACHE={};                                   // 清掉上一聯賽的戰績快取
    document.getElementById("searchResults").innerHTML="";
    if(!allIndexLoaded && !allBuilding){              // 全聯賽索引尚未就緒 → 先建當前聯賽的
      indexedLeague=null; PLAYER_INDEX=[];
      buildPlayerIndex(curLeague);
    } else if(allIndexLoaded && !PLAYER_INDEX.some(p=>p.league===curLeague)){
      mergeLeagueIndex(curLeague);
    }
    document.getElementById("searchResults").innerHTML="";
    load();
    buildPlayerIndex(curLeague);
    const sel=document.getElementById("moreLg");
    if(sel) sel.value=(LEAGUES.find(l=>l.id===id)||{}).more?id:"";
    applyView();
  }
  window.switchLeague=switchLeague;
  box.querySelectorAll(".lg[data-lg]").forEach(el=>el.onclick=()=>switchLeague(el.dataset.lg));
  const tb=document.getElementById("todayTab");
  if(tb) tb.onclick=()=>{ VIEW="today"; try{ const s=history.state; if(!(s&&s.v==="today")) history.pushState({v:"today"},""); }catch(e){} applyView(); const sel0=document.getElementById("moreLg"); if(sel0) sel0.value="";
    if(TODAY_ISO!==isoDate(curDate)) checkTodayGames(isoDate(curDate)); };
  const sel=document.getElementById("moreLg");
  if(sel) sel.onchange=()=>{ if(sel.value) switchLeague(sel.value); };
}

  // 名冊每 30 分鐘自動重抓(轉會/升降名單變動);比分每 90 秒、球員數據點開即時抓
  setInterval(()=>{
    if(document.hidden) return;
    TEAM_LIST={}; allIndexLoaded=false; indexedLeague=null;
    buildAllLeaguesIndex().then(()=>{ if(allIndexLoaded){ crossLeague=true; const b=document.getElementById("crossBtn"); if(b) b.classList.add("on"); } });
  }, 1800000);
  setTimeout(loadInjuries, 2000);
  try{history.replaceState({v:"today"},"");}catch(e){}
  applyView();
  LGDATA=lgdGet();
  setTimeout(async()=>{
    try{ await auditLeagues(false); }catch(e){ AUDITED=true; }
    checkTodayGames();
  }, 1500);
  // 即時節奏:有進行中的比賽 → 45 秒更新;否則 3 分鐘;每 20 分鐘做一次全聯賽完整掃描
  setInterval(()=>{
    if(document.hidden) return;
    const now=Date.now();
    const liveNow=Object.values(TODAY_GAMES).some(t=>t&&t.live);
    // 有比賽即將開賽(25 分鐘內)或剛開賽(25 分鐘內)→ 同樣用快節奏
    const nearKick=Object.values(TODAY_GAMES).some(t=>(t&&t.games||[]).some(g=>g.ts&&Math.abs(now-g.ts)<25*60000&&g.state!=="post"));
    const since=now-SWEEP_AT;
    if((liveNow||nearKick) ? since>=45000 : since>=180000) checkTodayGames(isoDate(curDate), true);
  }, 15000);
  setInterval(()=>{ if(!document.hidden) checkTodayGames(isoDate(curDate)); }, 1200000);
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden && Date.now()-SWEEP_AT>30000) checkTodayGames(isoDate(curDate), true);
  });            // 開站 2 秒後抓傷兵
  setInterval(()=>{ if(!document.hidden) loadInjuries(); }, 600000);   // 每 10 分鐘更新傷兵
  setInterval(()=>{ if(!document.hidden) load(); }, 90000);  // 每 90 秒自動更新
}
init();
</script>
</body>
</html>

/* ===== 對戰往績:抓主隊近兩季賽程,找出對上客隊的比賽 ===== */
let H2H_CACHE={};
async function loadH2H(lg, hid, aid){
  if(!hid||!aid) return null;
  const key=lg+"|"+hid+"|"+aid;
  if(H2H_CACHE[key]) return H2H_CACHE[key];
  const Y=new Date().getFullYear();
  const out=[];
  for(const yr of [Y, Y-1]){
    try{
      const d=await jget(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/teams/${hid}/schedule?season=${yr}`);
      (d.events||[]).forEach(ev=>{try{
        const c=(ev.competitions||[])[0]; if(!c)return;
        const st=(c.status||ev.status||{}).type||{}; if(!st.completed)return;
        const me=(c.competitors||[]).find(x=>String((x.team||{}).id)===String(hid));
        const op=(c.competitors||[]).find(x=>String((x.team||{}).id)===String(aid));
        if(!me||!op)return;
        const sv=x=>{const s=x.score; if(s==null)return null; return typeof s==="object"?+(s.value??s.displayValue):+s;};
        const a=sv(me), b=sv(op); if(a==null||b==null||isNaN(a)||isNaN(b))return;
        out.push({d:new Date(ev.date), my:a, op:b, home:(me.homeAway==="home"), id:ev.id, dt:ev.date});
      }catch(e){}});
    }catch(e){}
  }
  const seen={}; const ded=out.filter(m=>{ const k=m.id||(+m.d+"_"+m.my+"_"+m.op); if(seen[k])return false; seen[k]=1; return true; });
  out.length=0; out.push(...ded);
  out.sort((x,y)=>y.d-x.d);
  H2H_CACHE[key]=out.slice(0,6);
  return H2H_CACHE[key];
}
/* ================= 比賽詳情頁(像 MLB 版的逐場解說) ================= */

function gameNarrative(g,goals,statPairs){
  const hz=zhName(g.hn),az=zhName(g.an),p=predict(g.hn,g.an,g.odds,g.league||curLeague,g.hid,g.aid);
  const parts=[];

    if(!w) parts.push(`${hz} ${g.hs}-${g.as} ${az},雙方戰平`);
    else parts.push(`${w}以 ${Math.max(g.hs,g.as)}-${Math.min(g.hs,g.as)} ${g.hs>g.as?"主場":"客場"}${Math.abs(g.hs-g.as)>=3?"大勝":"擊敗"}對手`);
    const predOut=p.H>=p.D&&p.H>=p.A?"H":p.A>=p.D&&p.A>=p.H?"A":"D";

    if(predOut===realOut) parts.push(`模型賽前看好${pkz}(${Math.max(p.H,p.D,p.A).toFixed(0)}%),方向命中`);
    else parts.push(`模型賽前看好${pkz}(${Math.max(p.H,p.D,p.A).toFixed(0)}%),此役未能命中`);
    // 數據佐證(有才寫)
    const pos=statPairs.find(s=>s.key==="possessionPct"), sot=statPairs.find(s=>s.key==="shotsOnTarget");
    if(pos) parts.push(`控球 ${pos.h}% 對 ${pos.a}%`);
    if(sot) parts.push(`射正 ${sot.h} 比 ${sot.a}`);
    if(goals.length) parts.push(`共 ${goals.length} 粒進球`);
  }else if(g.state==="in"){
    parts.push(`比賽進行中${g.detail?`(${g.detail})`:""},目前 ${hz} ${g.hs??0} - ${g.as??0} ${az}`);
    parts.push(`賽前模型看好${p.pick==="和局"?"和局":(p.pick===g.hn?hz:az)}(主勝 ${p.H}%、和 ${p.D}%、客勝 ${p.A}%)`);
  }else{
    parts.push(`${hz}主場迎戰${az}`);
    const fh=formSeq(g.hn), fa=formSeq(g.an);
    if(fh||fa) parts.push(`近況 ${hz} ${fh||"—"} vs ${az} ${fa||"—"}(新→舊)`);
    parts.push(`模型預測:主勝 ${p.H}%、和 ${p.D}%、客勝 ${p.A}%,看好${p.pick==="和局"?"和局":(p.pick===g.hn?hz:az)},預期比分 ${p.si}-${p.sj}`);
    parts.push(`信心 ${p.conf}`);
  }
  return parts.join(",")+"。(解說由模型與 ESPN 數據自動生成)";
}
/* 射門視覺:透視半場 + 金色軌跡(Apple Sports 風)。無真實座標時為示意圖並誠實標示 */
function shotSVG(e){
  const hash=[...String(e.a||"x")].reduce((a,ch)=>a+ch.charCodeAt(0),0);
  let px,py,real=false;
  if(e.c&&e.c.x>=0&&e.c.x<=100&&e.c.y>=0&&e.c.y<=100){ px=e.c.x/100; py=Math.min(.72,Math.max(.08,e.c.y/100*.6+.08)); real=true; }
  else { px=.32+(hash%6)*.072; py=.16+(hash%4)*.075; }
  const W=y=>64+36*y, LX=y=>18-18*y;                    // 透視:深度 y∈[0,1] 對應寬度/左緣
  const P=(fx,fy)=>[LX(fy)+W(fy)*fx, 10+85*fy];         // 場上座標 → SVG
  const [sx,sy]=P(px,py);
  const tx=.22+((hash>>3)%5)*.14;                       // 進球落點(門內左/中/右)
  const gx=38+24*tx, gy=6.2;
  const box=(fx0,fy0,fx1,fy1)=>{const[a,b]=P(fx0,fy0),[c,d]=P(fx1,fy0),[e2,f]=P(fx1,fy1),[g2,i]=P(fx0,fy1);
    return `${a},${b} ${c},${d} ${e2},${f} ${g2},${i}`;};
  return `<svg viewBox="0 0 100 100" class="shotmap" aria-label="射門位置圖">
    <polygon points="${box(0,0,1,1)}" fill="none" stroke="var(--line)" stroke-width=".7"/>
    <polygon points="${box(.18,0,.82,.34)}" fill="none" stroke="var(--line)" stroke-width=".6"/>
    <polygon points="${box(.34,0,.66,.13)}" fill="none" stroke="var(--line)" stroke-width=".6"/>
    <path d="M ${P(.40,.34)[0]} ${P(.40,.34)[1]} Q ${P(.5,.45)[0]} ${P(.5,.45)[1]} ${P(.60,.34)[0]} ${P(.60,.34)[1]}" fill="none" stroke="var(--line)" stroke-width=".6"/>
    <rect x="36" y="0" width="28" height="8.5" fill="none" stroke="var(--chalk)" stroke-width="1.1"/>
    <ellipse cx="${gx}" cy="${gy}" rx="3.1" ry="1.5" fill="none" stroke="var(--hit)" stroke-width="1"/>
    <polygon points="${gx-1.9},${gy} ${gx+1.9},${gy} ${sx},${sy}" fill="var(--gold)" opacity=".85"/>
    <circle cx="${sx}" cy="${sy+2.2}" r="1.7" fill="none" stroke="var(--chalk)" stroke-width=".9"/>
    <circle cx="${sx}" cy="${sy-3.4}" r="1.6" fill="var(--chalk)"/>
    <path d="M ${sx} ${sy-1.8} L ${sx} ${sy+.6} M ${sx} ${sy-.9} L ${sx-2} ${sy+.4} M ${sx} ${sy-.9} L ${sx+1.8} ${sy-2.2}" stroke="var(--chalk)" stroke-width=".9" fill="none"/>
    <text x="50" y="98.5" text-anchor="middle" font-size="3.4" fill="var(--muted)" font-family="var(--mono)">${real?"位置依 ESPN 座標":"示意圖(ESPN 未提供實際射門座標)"}</text>
  </svg>`;
}

      try{ return __SP(p,fromPop); }
      catch(e){ __toast("⚠ 開啟球員頁失敗:"+String((e&&e.message)||e).slice(0,70), 1); }
    };
  }catch(e){}
  window.CLOUD=null;
  const __resolveCalib=j=>{ try{ for(const lg in (j.leagues||{})){ const T=j.leagues[lg]&&j.leagues[lg].teams; if(!T) continue; for(const k in T){ const t=T[k]; if(t&&t.$&&T[t.$]) T[k]=T[t.$]; } } }catch(e){} return j; };   // e154:calib v12 別名 {$:"#id"} 還原
  const __applyCalib=j=>{
    if(j&&j.leagues){ window.CLOUD=__resolveCalib(j);
      try{ localStorage.setItem("euroCalibCache", JSON.stringify(j)); }catch(e){}
      const el=document.getElementById("cloudTag");
      if(el) el.textContent="☁ 雲端校準("+(j.days||28)+"天)· 更新 "+String(j.updated||"").replace("T"," ").slice(5,16)+" · 樣本 "+Math.round(+j.n||0)+" 場";
      return true;
    }
    return false;
  };
  (async()=>{
    for(let i=0;i<3;i++){                          // 失敗重試 3 次(2s/4s 退避)
      try{
        const r=await fetch("calib.json?_="+Date.now(),{cache:"no-store"});
        if(r.ok && __applyCalib(await r.json())) return;
      }catch(e){}
      await new Promise(res=>setTimeout(res, 2000*(i+1)));
    }
    try{                                            // 全滅 → 用上次成功的本機快取(不裸奔)
      const c=JSON.parse(localStorage.getItem("euroCalibCache")||"null");
      if(__applyCalib(c)){ const el=document.getElementById("cloudTag");
        if(el) el.textContent+="(本機快取)"; }
    }catch(e){}
  })();
  applyView();
}

/* ================= 載入 ================= */
let LOADING=false, PENDING=false;
async function load(){
  if(LOADING){ PENDING=true; return; }   // 忙碌中收到請求 → 排隊,結束後補跑一次
  LOADING=true;
  const btn=document.getElementById("loadBtn"), st=document.getElementById("status");
  btn.classList.add("spin"); btn.disabled=true; st.className="status"; st.textContent="載入中…";
  if(!overlayOpen()) hideTeam();                       // e157:看比賽/球隊頁時,自動刷新不關頁
  const dateStr=ymd(curDate);
  document.getElementById("upd").textContent=isoDate(curDate)+" "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  try{
    // ESPN 以美國/UTC 日期分組;抓「前一天+當天」範圍再依台灣當日過濾,確保台灣時間正確
    const d0=new Date(curDate); d0.setDate(d0.getDate()-1);
    // 先抓積分榜:攻防形狀與戰績橫幅都靠它(失敗不影響賽事)
    try{ const sd0=await jget(espnStand(curLeague)); renderStandings(sd0); }catch(e){}
    loadStandFor(curLeague).catch(()=>{});
    const data=await jget(espnScore(curLeague, ymd(d0)+"-"+dateStr), true);
    const all=parseEvents(data);
    const games=all.filter(g=>g.localIso===isoDate(curDate));
    await gradeFinished(all.filter(g=>g.completed));   // 兩天內所有完賽都納入學習(含場面數據)
    if(AUDITED && TODAY_ISO!==isoDate(curDate)) checkTodayGames(isoDate(curDate));
    computeTuning();                              // 依累積賽果更新近況/和局/主場調參
    renderScorecard();
    renderInsights();
    try{ await loadNews(); }catch(e){}
    // 切聯盟後當日無賽事 → 自動跳到最近有比賽的日期(先找未來 21 天,再找過去 7 天)
    if(!games.length && window.__autoJump){
      window.__autoJump=false;
      try{
        const t0=new Date(curDate);
        let target=null;
        // 往未來找:3 段各 7 天,找到就停(分段避免長區間查詢失敗)
        for(let seg=0; seg<3 && !target; seg++){
          const a=new Date(t0); a.setDate(a.getDate()+seg*7);
          const b=new Date(t0); b.setDate(b.getDate()+(seg+1)*7);
          try{
            const sb=await jget(espnScore(curLeague, ymd(a)+"-"+ymd(b)), true);
            const evs=parseEvents(sb).filter(g=>g.localIso>=isoDate(t0));
            if(evs.length) target=evs.map(g=>g.localIso).sort()[0];
          }catch(e){}
        }
        if(!target){   // 未來 21 天都沒有 → 往回找最近踢過的一天
          const back=new Date(t0); back.setDate(back.getDate()-7);
          try{
            const sb=await jget(espnScore(curLeague, ymd(back)+"-"+ymd(t0)), true);
            const evs=parseEvents(sb);
            if(evs.length) target=evs.map(g=>g.localIso).sort().slice(-1)[0];
          }catch(e){}
        }
        if(target && target!==isoDate(curDate)){
          curDate=new Date(target+"T12:00:00");
          const dp=document.getElementById("datePick"); if(dp) dp.value=target;
          st.textContent=`該日無賽事,已跳至最近比賽日 ${target}`;
          LOADING=false; btn.classList.remove("spin"); btn.disabled=false;
          load();
          return;
        }
      }catch(e){}
    }
    window.__autoJump=false;
    renderGames(games);
    renderHeadlines(games);
    st.textContent=`已更新 · ${games.length} 場`;
    window.__lastGames=games;
    loadSchedules(games).then(chg=>{ if(chg&&window.__lastGames===games){ renderGames(games); renderTodaySection&&renderTodaySection(); } });
  }catch(e){
    document.getElementById("games").innerHTML=`<div class="empty">無法載入賽事資料。<br>可能是網路、跨域限制或該聯賽代碼異常。稍後再試或切換聯賽。<br><span style="color:var(--miss)">${e.message}</span></div>`;
    st.className="status err"; st.textContent="載入失敗";
  }
  // standings(獨立,失敗不影響賽事)
  try{
    /* 積分榜已於賽事前載入(供攻防模型使用),此處不重複抓取 */
  }catch(e){
    document.getElementById("standings").innerHTML=`<div class="empty">積分榜暫時無法載入(休賽期或來源限制)。</div>`;
  }
  btn.classList.remove("spin"); btn.disabled=false;
  LOADING=false;
  if(PENDING){ PENDING=false; setTimeout(load,60); }
}

  function switchLeague(id,fromPop){

    STAND_CACHE={};                                   // 清掉上一聯賽的戰績快取

    if(!allIndexLoaded && !allBuilding){              // 全聯賽索引尚未就緒 → 先建當前聯賽的
      indexedLeague=null; PLAYER_INDEX=[];
      buildPlayerIndex(curLeague);
    } else if(allIndexLoaded && !PLAYER_INDEX.some(p=>p.league===curLeague)){

  }
  window.switchLeague=switchLeague;

  const tb=document.getElementById("todayTab");
  if(tb) tb.onclick=()=>{ VIEW="today"; try{ const s=history.state; if(!(s&&s.v==="today")) history.pushState({v:"today"},""); }catch(e){} applyView(true); const sel0=document.getElementById("moreLg"); if(sel0) sel0.value="";
    if(TODAY_ISO!==isoDate(curDate)) checkTodayGames(isoDate(curDate)); };

/* ===== e136:自動更新不跳畫面 =====
   原理:重繪前記住「畫面上第一個可見區塊」和它距離視窗頂端的距離;重繪後找回同一個區塊,
   把它放回一模一樣的位置。這樣就算上方的積分榜/心得面板高度變了,你正在看的那一行也不會移動。 */
function _scrollAnchorTake(){
  try{
    const sy=window.scrollY;
    const cands=document.querySelectorAll(".tg-row[data-gid],.game .detail-btn[data-gid],[id]");
    for(const el of cands){
      if(el.id==="teamView"||el.id==="gameView"||el.tagName==="SCRIPT"||el.tagName==="STYLE") continue;
      const r=el.getBoundingClientRect(); if(!(r.height>0)) continue;
      if(r.bottom>0){ const key=el.id?("#"+el.id):(el.dataset.gid?("[data-gid=\""+el.dataset.gid+"\"]"):null);
        if(key) return {key,top:r.top,sy}; }
    }
    return {key:null,top:0,sy};
  }catch(e){ return null; }
}
function _scrollAnchorRestore(an){
  if(!an) return;
  try{
    let el=an.key?document.querySelector(an.key):null;
    if(el&&an.key.startsWith("[")) el=[...document.querySelectorAll(an.key)].find(x=>x.getBoundingClientRect().height>0)||el;
    if(el){ const d=el.getBoundingClientRect().top-an.top; if(Math.abs(d)>1) window.scrollBy(0,d); }
    else if(Math.abs(window.scrollY-an.sy)>1) window.scrollTo(0,an.sy);
  }catch(e){}
}
function _keepScroll(fn){
  return function(){ const an=_scrollAnchorTake(); const r=fn.apply(this,arguments);
    _scrollAnchorRestore(an); requestAnimationFrame(()=>_scrollAnchorRestore(an)); return r; };
}
["renderGames","renderStandings","renderHeadlines","renderScorecard","renderInsights","renderTodaySection","renderFocus"].forEach(n=>{
  if(typeof window[n]==="function") window[n]=_keepScroll(window[n]);
});
async function loadCloudPred(){
  try{
    const r=await fetch("cloud-pred.json?_="+Date.now(),{cache:"no-store"}); if(!r.ok) return false;
    const j=await r.json(); if(!j||!j.sc) return false;
    CLOUD_PRED=j;
    // 帳本合併:雲端有的以雲端為準(所有裝置一致);雲端沒有的保留本機
    const mine=scGet(); let n=0;
    for(const id in j.sc){ const c=j.sc[id]; if(!c||!c.pred) continue; mine[id]={...(mine[id]||{}),...c}; if(!("void" in c)) delete mine[id].void; n++; }   // e156:作廢與否也以雲端為準
    scSet(mine);
    // 學習參數:雲端為準
    const P=j.params||{};
    for(const k of ["euroADJ","euroAD","euroMKTW","euroADv2","euroLGD","euroDYN"]){ if(P[k]!=null){ try{ localStorage.setItem(k,P[k]); }catch(e){} } }
    ADJ_CACHE=adjGet(); AD_CACHE=adGet(); MKT_W=mktWGet();
        const el=document.getElementById("cloudPredTag"); if(el){ const ec=j.espnCors; const dt=s=>s?String(s).replace("T"," ").slice(5,16):"";
      const espn=ec?` · ESPN:主站 ${ec.siteApi?"✔":`✖(自 ${dt(ec.siteApiDownSince)})`} / 備站 ${ec.webApi?"✔":"✖"}(每30分偵測${ec.siteApi&&ec.webApi?"":",斷供時自動走備站→雲端"})`:"";
      el.textContent=`☁ 雲端統一預測 · 更新 ${String(j.updated||"").replace("T"," ").slice(5,16)} · 帳本 ${j.n||0} 筆${espn}`;
      // e154:雲端排程延遲偵測 —— GitHub 排程在尖峰時段會被延後數小時,超過 2 小時未更新即提醒(鎖定值可能偏舊)
      try{ const ageMin=(Date.now()-Date.parse(j.updated||0))/60000;
        if(ageMin>120){ el.textContent+=` ⚠ 雲端已 ${(ageMin/60).toFixed(1)} 小時未更新(GitHub 排程延遲,新賽事暫用本機計算)`; el.style.color="var(--gold)"; } }catch(e){} }
    return true;
  }catch(e){ return false; }
}
function init(){
  document.getElementById("buildTag").textContent="build "+BUILD;
  migrateSnapshots();
  // e140:先吃雲端統一預測,再算學習參數 → 任何裝置看到的都一樣
  loadCloudPred().then(ok=>{ computeTuning(); if(ok){ try{ renderScorecard(); renderInsights(); load(); }catch(e){} } });
  computeTuning();
  let th="navy"; try{th=localStorage.getItem("euroTheme")||"navy";}catch(e){}
  applyTheme(th);
  document.querySelectorAll(".th").forEach(el=>el.onclick=()=>applyTheme(el.dataset.th));
  document.querySelectorAll(".nav-p").forEach(el=>el.onclick=()=>{
    // 若正在看比賽:積分榜/賽事預測切到「該場比賽的聯賽」,不再跳去別的聯盟
    const gv0=document.getElementById("gameView");
    const ctxLg=(gv0&&!gv0.classList.contains("hidden")&&window.__gvLg)?window.__gvLg:null;
    if(ctxLg && ctxLg!==curLeague && window.switchLeague &&
       (el.dataset.sec==="standSec"||el.dataset.sec==="fixturesSec")){
      window.switchLeague(ctxLg);                      // 會自動載入該聯賽積分榜與賽程
      setTimeout(()=>{ const s2=document.getElementById(el.dataset.sec);
        if(s2){ s2.classList.remove("hidden"); try{s2.scrollIntoView({behavior:"smooth"});}catch(e){s2.scrollIntoView();} } }, 350);
      return;
    }
    // 先退出比賽詳情/球隊頁,恢復主頁面各區塊
    const gv=document.getElementById("gameView");
    if(gv&&!gv.classList.contains("hidden")){
      gv.classList.add("hidden"); window.__gvId=null;
      ["fixturesSec","insightSec","standSec","hlSec","todaySec"].forEach(id=>{
        const e2=document.getElementById(id); if(e2) e2.classList.remove("hidden");

  buildLeagueTabs();

  dp.value=isoDate(curDate);
  dp.onchange=()=>{const [y,m,d]=dp.value.split("-").map(Number);curDate=new Date(y,m-1,d);load();};
  document.getElementById("prevBtn").onclick=()=>{curDate.setDate(curDate.getDate()-1);dp.value=isoDate(curDate);load();};
  document.getElementById("nextBtn").onclick=()=>{curDate.setDate(curDate.getDate()+1);dp.value=isoDate(curDate);load();};
  document.getElementById("todayBtn").onclick=()=>{curDate=new Date();dp.value=isoDate(curDate);load();};
  document.getElementById("loadBtn").onclick=load;
  document.getElementById("backBtn").onclick=()=>{ if(history.state&&history.state.v){history.back();} else hideTeam(); };
  // 瀏覽器上一頁:回到主列表或上一個檢視,而不是整頁跑掉
  window.addEventListener("popstate",e=>{
    const s=e.state;
    if(!s||!s.v){ VIEW="today"; hideTeam(); }
    else if(s.v==="today"){ VIEW="today"; hideTeam(); }
    else if(s.v==="league"){ if(s.lg&&curLeague!==s.lg) switchLeague(s.lg,true); else { VIEW="league"; hideTeam(); } }
    else if(s.v==="team") showTeam(s.name,true);
    else if(s.v==="player") showPlayer(s.p,true);
    else if(s.v==="game"&&s.g) showGame(s.g,true);
  });
  document.getElementById("gameBackBtn").onclick=()=>{ if(history.state&&history.state.v){history.back();} else { VIEW="today"; hideTeam(); } };
  document.getElementById("gvPrev").onclick=()=>gvNav(-1);
  document.getElementById("gvNext").onclick=()=>gvNav(1);
  document.addEventListener("keydown",ev=>{                     // e157:比賽頁鍵盤 ← → 切換、Esc 返回
    try{ const gv=document.getElementById("gameView"); if(!gv||gv.classList.contains("hidden")) return;
      const tg=ev.target; if(tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
      if(ev.key==="ArrowLeft"){ gvNav(-1); ev.preventDefault(); }
      else if(ev.key==="ArrowRight"){ gvNav(1); ev.preventDefault(); }

  const sb=document.getElementById("searchBox");

  // 位置篩選 chip

  // 跨五大聯賽 toggle
  document.getElementById("crossBtn").onclick=async()=>{   // 點=手動強制重抓最新名冊
    TEAM_LIST={}; allIndexLoaded=false; indexedLeague=null;
    await buildAllLeaguesIndex();
    if(allIndexLoaded){ crossLeague=true; document.getElementById("crossBtn").classList.add("on"); }
    searchPlayers(sb.value);
  };
  load();
  buildPlayerIndex(curLeague);
  // 全自動:1.5 秒後在背景把六個聯賽的球員全部抓好(不用手動點)
  setTimeout(async()=>{
    await buildAllLeaguesIndex();
    if(allIndexLoaded){ crossLeague=true; const b=document.getElementById("crossBtn"); if(b) b.classList.add("on"); }
  },1500);
  // 名冊每 30 分鐘自動重抓(轉會/升降名單變動);比分每 90 秒、球員數據點開即時抓
  setInterval(()=>{
    if(document.hidden) return;
    TEAM_LIST={}; allIndexLoaded=false; indexedLeague=null;
    buildAllLeaguesIndex().then(()=>{ if(allIndexLoaded){ crossLeague=true; const b=document.getElementById("crossBtn"); if(b) b.classList.add("on"); } });
  }, 1800000);
  setTimeout(loadInjuries, 2000);
  try{history.replaceState({v:"today"},"");}catch(e){}
  applyView();
  LGDATA=lgdGet();
  setTimeout(async()=>{
    try{ await auditLeagues(false); }catch(e){ AUDITED=true; }
    checkTodayGames();
  }, 1500);
  // 即時節奏:有進行中的比賽 → 45 秒更新;否則 3 分鐘;每 20 分鐘做一次全聯賽完整掃描
  setInterval(()=>{
    if(document.hidden) return;
    const now=Date.now();
    const liveNow=Object.values(TODAY_GAMES).some(t=>t&&t.live);
    // 有比賽即將開賽(25 分鐘內)或剛開賽(25 分鐘內)→ 同樣用快節奏
    const nearKick=Object.values(TODAY_GAMES).some(t=>(t&&t.games||[]).some(g=>g.ts&&Math.abs(now-g.ts)<25*60000&&g.state!=="post"));
    const since=now-SWEEP_AT;
    if((liveNow||nearKick) ? since>=45000 : since>=180000) checkTodayGames(isoDate(curDate), true);
  }, 15000);
  setInterval(()=>{ if(!document.hidden) checkTodayGames(isoDate(curDate)); }, 1200000);
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden && Date.now()-SWEEP_AT>30000) checkTodayGames(isoDate(curDate), true);
  });            // 開站 2 秒後抓傷兵
  setInterval(()=>{ if(!document.hidden) loadInjuries(); }, 600000);   // 每 10 分鐘更新傷兵
  setInterval(()=>{
    if(!document.hidden && !overlayOpen()) load();   // 看比賽/球隊/球員頁時不自動刷新(不打斷閱讀)
  }, 90000);
}
